name: Build Tweak
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Theos
        uses: logicanimal/theos-action@main
      - name: Build Tweak
        run: make
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Tweak-Result
          path: packages/*.deb
